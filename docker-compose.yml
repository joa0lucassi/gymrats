services:
  database:
    image: postgres:18.6
    container_name: gymrats-database
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - gymrats_postgres_data:/var/lib/postgresql

volumes:
  gymrats_postgres_data: